<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="logincustomized.css" />
    <title>CustomerLoginForm</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="width: 100%">
    <div style="width: 90%; margin: auto">
      <h1 style="color: orange; margin-bottom: 41x">LOGO</h1>
      <div class="customerToggle">
        <p style="margin: 0">Are you a vendor?</p>
        <div>
          <label class="switch">
            <input type="checkbox" />
            <span class="slider"></span>
          </label>
        </div>
      </div>
        <h4 id="header">vendor Sign In</h4>
      </div>

      <!-- <p class="details detailsUsername">Username</p> -->
       <div class="signInInput" style="width: 90%; margin: auto; margin-bottom: 40px;">
        <input style="border: none; border-bottom: 1px solid black; width: 100%; padding-bottom: 10px; " type="text" placeholder="Businessname">
       </div>
       <div class="signInInput" style="width: 90%; margin: auto;">
      <input style="border: none; border-bottom: 1px solid black; width: 100%; padding-bottom: 10px;" type="password" placeholder="Password">
       </div>
      
      <!-- <p class="details">Password</p> -->

      <div class="button">
        <button id="sign-in">
          <a style="width: 100%" href="">Sign In</a>
        </button>

        <p id="footer">
          Don't have an account? <a id="sign-up" href="sign up.html">Sign Up</a>
        </p>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
